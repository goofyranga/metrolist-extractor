[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrolist-extractor"
version = "0.6.0"
description = "Export Metrolist offline downloads from Waydroid without re-encoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cooper Shaw" }]
dependencies = []

[project.scripts]
metrolist-extract = "metrolist_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
